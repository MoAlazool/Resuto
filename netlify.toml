[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "24"
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs", "@netlify/database", "pg", "qrcode", "serverless-http"]
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
[[redirects]]
  from = "/qr/*"
  to = "/.netlify/functions/api/qr/:splat"
  status = 200
[[redirects]]
  from = "/media/*"
  to = "/.netlify/functions/api/media/:splat"
  status = 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'"
